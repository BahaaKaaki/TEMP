<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PPTX Export Test — Full Pipeline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
    h1 { font-size: 18px; margin-bottom: 12px; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-end; flex-wrap: wrap; }
    .row.full { flex-wrap: nowrap; }
    label { font-size: 12px; color: #999; display: block; margin-bottom: 4px; }
    input, textarea, select { background: #2a2a3e; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 8px 12px; font-size: 13px; font-family: inherit; }
    input { flex: 1; min-width: 200px; }
    textarea { width: 100%; min-height: 80px; resize: vertical; }
    button { padding: 8px 20px; border-radius: 6px; border: none; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-gen { background: #2563eb; color: #fff; }
    .btn-gen:hover { background: #3b82f6; }
    .btn-export { background: #8E1E1E; color: #fff; }
    .btn-export:hover { background: #a52a2a; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { font-size: 12px; color: #888; min-height: 18px; margin: 6px 0; }
    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }
    .panels { display: flex; gap: 16px; margin-top: 8px; }
    .panel { flex: 1; min-width: 0; }
    .panel h3 { font-size: 13px; color: #888; margin-bottom: 6px; }
    .slide-frame { width: 100%; aspect-ratio: 16/9; border: 2px solid #333; border-radius: 8px; overflow: hidden; background: #fff; position: relative; }
    .slide-frame iframe { width: 960px; height: 540px; border: none; position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    .log { background: #0d0d1a; border: 1px solid #333; border-radius: 8px; padding: 12px; font-family: 'Cascadia Code', Consolas, monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; color: #aaa; height: 100%; min-height: 300px; max-height: 70vh; overflow: auto; }
    .log .h { color: #60a5fa; font-weight: bold; }
    .log .ok { color: #4ade80; }
    .log .err { color: #f87171; }
    .log .dim { color: #555; }
    .step-bar { display: flex; gap: 8px; margin: 10px 0; }
    .step { padding: 4px 12px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    .step.active { background: #2563eb; color: #fff; }
    .step.done { background: #166534; color: #fff; }
    .step.wait { background: #333; color: #666; }
  </style>
</head>
<body>
  <h1>PPTX Full Pipeline Test</h1>

  <div class="row">
    <div style="flex:1">
      <label>Topic / prompt</label>
      <input id="prompt" value="Create a slide about the 3 pillars of digital transformation: Cloud Migration, Data Analytics, and AI Integration. Include metrics." />
    </div>
    <button class="btn-gen" id="genBtn" onclick="runGenerate()">1. Generate HTML</button>
    <button class="btn-export" id="expBtn" onclick="runExport()" disabled>2. Export to PPTX</button>
  </div>

  <div class="step-bar">
    <span class="step wait" id="s1">1. Generate HTML</span>
    <span class="step wait" id="s2">2. Preview</span>
    <span class="step wait" id="s3">3. Export PPTX</span>
    <span class="step wait" id="s4">4. Download</span>
  </div>
  <div class="status" id="status">Enter a topic and click "Generate HTML"</div>

  <div class="panels">
    <div class="panel">
      <h3>HTML Preview (what the AI generated)</h3>
      <div class="slide-frame"><iframe id="preview"></iframe></div>
    </div>
    <div class="panel">
      <h3>Log</h3>
      <div class="log" id="log">Waiting...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script>
// ─── Config ──────────────────────────────────────────────────────────────
const BACKEND = 'http://localhost:3001/api/ai/chat';
const MODEL_HTML = 'vertex_ai.anthropic.claude-opus-4-6';
const MODEL_PPTX = 'vertex_ai.anthropic.claude-opus-4-6';
const BASIC_AUTH = 'Basic ' + btoa('team:edwin2026');
const MAX_RETRIES = 3;

// ─── State ───────────────────────────────────────────────────────────────
let currentSlideHTML = '';
let currentSlideCSS = '';

// ─── Iframe scaling (960px slide → fit container) ────────────────────────
function scaleIframe() {
  const frame = document.querySelector('.slide-frame');
  const iframe = document.getElementById('preview');
  if (!frame || !iframe) return;
  const scale = frame.clientWidth / 960;
  iframe.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', scaleIframe);
requestAnimationFrame(scaleIframe);

// ─── Base slide CSS (design tokens resolved for "bold" vibe) ─────────────
const BASE_SLIDE_CSS = `
  :root {
    --main: #111111; --heading: #111111; --body: #222222; --secondary: #222222;
    --muted: #4A4F57; --meta: #4A4F57; --coal: #4A4F57;
    --accent: #8E1E1E; --accent-hover: #A32020; --maroon: #8E1E1E; --red: #A32020;
    --accent-soft: #F8E3E3; --on-accent: #FFFFFF;
    --page: #FFFFFF; --surface: #F7F9FB; --surface-alt: #EEF2F6;
    --border: #E6E9EE;
    --success: #059669; --success-soft: #DCFCE7;
    --warning: #D97706; --warning-soft: #FEF3C7;
    --danger: #DC2626; --danger-soft: #FEE2E2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin: 0; background: #fff; }
  .slide {
    width: 960px; height: 540px; background: var(--page); font-family: Arial, sans-serif;
    position: relative; overflow: hidden; display: flex; flex-direction: column;
  }
  .slide .title { font: 400 28px/1.2 Georgia, serif; color: var(--heading); margin: 0; padding: 30px 34px 0; flex-shrink: 0; }
  .slide .subtitle { font: 700 18px/1.3 Arial, sans-serif; color: var(--accent-hover); margin: 0; padding: 8px 34px 0; flex-shrink: 0; }
  .slide .frame { padding: 12px 34px 0; display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  .slide .footer { position: absolute; bottom: 0; left: 0; right: 0; height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 34px; font: 400 10px Arial; color: var(--muted); flex-shrink: 0; }
`;

// ─── Log helpers ─────────────────────────────────────────────────────────
const logEl = document.getElementById('log');
function log(msg, cls) { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = msg + '\n'; logEl.appendChild(s); logEl.scrollTop = logEl.scrollHeight; }
function clearLog() { logEl.innerHTML = ''; }
function setStatus(msg, cls) { const el = document.getElementById('status'); el.textContent = msg; el.className = 'status' + (cls ? ' ' + cls : ''); }
function setStep(n, state) { document.getElementById('s' + n).className = 'step ' + state; }

// ─── AI call ─────────────────────────────────────────────────────────────
async function callAI(model, systemPrompt, userPrompt) {
  const res = await fetch(BACKEND, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': BASIC_AUTH },
    body: JSON.stringify({ model, messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userPrompt }], temperature: 0.2, max_tokens: 8192 }),
  });
  if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '';
}

// ═══════════════════════════════════════════════════════════════════════════
// STEP 1: Generate HTML slide from topic
// ═══════════════════════════════════════════════════════════════════════════

const HTML_SYSTEM_PROMPT = `You are a slide designer. You receive a topic and produce HTML + scoped CSS that renders a polished consulting slide.

CANVAS:
\`\`\`html
<div class="slide">
  <h1 class="title">[Insight-driven headline, 8-12 words]</h1>
  <h2 class="subtitle">[Topic label, 2-4 word noun phrase]</h2>
  <div class="frame">
    <!-- Your custom layout here -->
  </div>
  <footer class="footer"><span>Strategy&</span><span>1 / 1</span></footer>
</div>
\`\`\`

DESIGN TOKENS (use var(--token) for ALL colors):
- Headings: var(--heading)  Body: var(--body)  Muted: var(--muted)
- Accent: var(--accent)  Accent hover: var(--accent-hover)  Light accent bg: var(--accent-soft)
- Text on accent: var(--on-accent)  Page bg: var(--page)  Card bg: var(--surface)
- Borders: var(--border)  Success: var(--success)  Danger: var(--danger)

FONTS: Georgia serif for display numbers. Arial sans-serif for body (12-14px), headings (14-18px bold), labels (11-12px).

RULES:
1. Scope all custom CSS under \`.slide .frame\`
2. Use design tokens for ALL colors — never hardcode hex
3. Elements with accent background MUST have color: var(--on-accent)
4. Use flexbox/grid for layout. Frame is 904 x 366 px.
5. No JavaScript. No bare element selectors. No restyling .slide/.title/.subtitle/.frame/.footer
6. Make it look like a premium McKinsey/BCG slide

OUTPUT: Return ONLY a <style> block followed by the slide HTML. No markdown fences, no explanation.`;

async function runGenerate() {
  const prompt = document.getElementById('prompt').value.trim();
  if (!prompt) return;
  const genBtn = document.getElementById('genBtn');
  const expBtn = document.getElementById('expBtn');
  genBtn.disabled = true;
  expBtn.disabled = true;
  clearLog();
  setStep(1, 'active'); setStep(2, 'wait'); setStep(3, 'wait'); setStep(4, 'wait');
  setStatus('Generating HTML slide...', '');

  log('STEP 1: Generate HTML from topic', 'h');
  log('Model: ' + MODEL_HTML);
  log('Prompt: ' + prompt, 'dim');
  log('');

  try {
    const t0 = Date.now();
    const raw = await callAI(MODEL_HTML, HTML_SYSTEM_PROMPT, `Create a single slide about: ${prompt}`);
    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
    log(`AI responded in ${elapsed}s (${raw.length} chars)`);

    // Parse <style> and HTML
    let css = '', html = '';
    const cleaned = raw.replace(/```html\n?/g, '').replace(/```\n?/g, '').trim();
    const styleMatch = cleaned.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
    if (styleMatch) {
      css = styleMatch[1].trim();
      html = cleaned.replace(/<style[^>]*>[\s\S]*?<\/style>/i, '').trim();
    } else {
      html = cleaned;
    }

    if (!html.includes('class="slide"')) {
      throw new Error('AI response does not contain a valid slide HTML');
    }

    currentSlideHTML = html;
    currentSlideCSS = css;

    log(`Extracted CSS: ${css.length} chars`, 'dim');
    log(`Extracted HTML: ${html.length} chars`, 'dim');
    log('✓ HTML generated successfully', 'ok');

    // Render preview
    setStep(1, 'done'); setStep(2, 'active');
    const iframe = document.getElementById('preview');
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(`<!DOCTYPE html><html><head><style>${BASE_SLIDE_CSS}\n${css}</style></head><body>${html}</body></html>`);
    doc.close();
    scaleIframe();
    log('✓ Preview rendered', 'ok');
    setStep(2, 'done');

    setStatus('HTML generated. Click "Export to PPTX" to continue.', 'ok');
    expBtn.disabled = false;
  } catch (err) {
    log('✗ ' + err.message, 'err');
    setStatus('Generation failed: ' + err.message, 'err');
    setStep(1, 'wait');
  }
  genBtn.disabled = false;
}

// ═══════════════════════════════════════════════════════════════════════════
// STEP 2: Convert HTML → PPTX via AI
// ═══════════════════════════════════════════════════════════════════════════

const PPTX_SYSTEM_PROMPT = `You convert HTML slides to PptxGenJS code.

STANDARD POSITIONS: Title x:0.48 y:0.42 w:12.36 | Subtitle x:0.48 y:1.40 | Content starts y:1.90 | Footer y:7.05

YOUR TASK:
1. Extract ALL text from the HTML exactly as written
2. Create PptxGenJS code that reproduces the slide layout
3. Use the exact colors from the CSS RULES provided (resolve var() tokens to hex)

CRITICAL: Never use placeholder text. Extract the ACTUAL text from the HTML.

EXACT COLOR FIDELITY: The CSS RULES and RESOLVED TOKENS are the ground truth.
Match every color exactly. If a CSS rule says color: var(--accent) and --accent = #8E1E1E, use color:'8E1E1E'.

FOOTER: Do NOT render <footer> content. DO call addFooter(slide, slideNum, totalSlides) once.

OUTPUT: Return ONLY a JavaScript array of functions, no markdown.`;

const RESOLVED_TOKENS = `CSS variable resolved values:
--heading = #111111, --body = #222222, --muted = #4A4F57, --meta = #4A4F57
--accent = #8E1E1E, --accent-hover = #A32020, --maroon = #8E1E1E, --red = #A32020
--accent-soft = #F8E3E3, --on-accent = #FFFFFF
--page = #FFFFFF, --surface = #F7F9FB, --surface-alt = #EEF2F6
--border = #E6E9EE
--success = #059669, --danger = #DC2626, --warning = #D97706`;

function buildPptxPrompt(html, css, errorFeedback) {
  const cleanHTML = html.replace(/<footer[\s\S]*?<\/footer>/gi, '');
  let prompt = `TASK: Convert this HTML slide to a PptxGenJS function.

========== RESOLVED CSS TOKENS ==========
${RESOLVED_TOKENS}

========== SLIDE HTML ==========
${cleanHTML}

========== CUSTOM CSS ==========
${css || '/* none */'}

========== OUTPUT FORMAT ==========
[
  function(pptx, slideNum, totalSlides) {
    const slide = pptx.addSlide();
    // Use hex colors from resolved tokens above (e.g. color:'8E1E1E' for var(--accent))
    // ... your PptxGenJS code here ...
    addFooter(slide, slideNum, totalSlides);
  }
]

MANDATORY — EXACT COLOR FIDELITY:
1. Resolve every var(--token) to its hex value using the RESOLVED CSS TOKENS above
2. Example: var(--accent) → '8E1E1E', var(--body) → '222222', var(--surface) → 'F7F9FB'
3. For background-color → fill:{color:'HEX'}
4. Remove # prefix for PptxGenJS
5. Do NOT invent colors. Use ONLY colors from the resolved tokens.

CRITICAL:
- Use ACTUAL text from the HTML. Never use placeholder text.
- Use ACTUAL colors from the resolved tokens. Never substitute your own.`;

  if (errorFeedback) {
    prompt += `\n\n========== FIX REQUIRED ==========
ERROR: ${errorFeedback.type} — ${errorFeedback.message}
PREVIOUS CODE:\n${errorFeedback.code}
Fix the error and return the corrected array.`;
  }
  return prompt;
}

// ─── Code extraction ─────────────────────────────────────────────────────
function extractJSArray(raw) {
  let c = raw.replace(/```javascript\n?/g, '').replace(/```js\n?/g, '').replace(/```\n?/g, '').trim();
  const s = c.indexOf('[');
  if (s === -1) throw new Error('No [ found');
  let d = 0, inS = false, sCh = '', e = -1;
  for (let i = s; i < c.length; i++) {
    const ch = c[i], pv = i > 0 ? c[i-1] : '';
    if ((ch === '"' || ch === "'" || ch === '`') && pv !== '\\') { if (!inS) { inS = true; sCh = ch; } else if (ch === sCh) inS = false; }
    if (!inS) { if (ch === '[') d++; else if (ch === ']') { d--; if (d === 0) { e = i; break; } } }
  }
  if (e <= s) throw new Error('No matching ]');
  return c.substring(s, e + 1).replace(/;\s*$/, '').trim();
}

// ─── Validation ──────────────────────────────────────────────────────────
const COLORS = { main:'111111', meta:'4A4F57' };
function addFooter(slide, n, t) { slide.addText(n + ' / ' + t, { x:11.5, y:7.05, w:1.3, h:0.25, fontFace:'Arial', fontSize:10, color:COLORS.meta, align:'right' }); }

function validate(code) {
  const checks = [];
  let fns;
  try { fns = new Function('context', 'const { addFooter, COLORS } = context; return ' + code)({ addFooter, COLORS }); checks.push({ n: 'Parse', ok: true }); }
  catch (e) { checks.push({ n: 'Parse', ok: false, e: e.message }); return { checks, valid: false, err: { type: 'SyntaxError', message: e.message } }; }

  if (!Array.isArray(fns) || typeof fns[0] !== 'function') { checks.push({ n: 'Format', ok: false, e: 'Not [fn]' }); return { checks, valid: false, err: { type: 'Format', message: 'Not [function(){...}]' } }; }
  checks.push({ n: 'Format', ok: true });

  const p = new PptxGenJS(); p.defineLayout({ name: 'CUSTOM', width: 13.333, height: 7.5 }); p.layout = 'CUSTOM';
  try { p.defineSlideMaster({ title: 'BLANK_SLIDE', objects: [] }); } catch(e) {}
  try { fns[0](p, 1, 1); checks.push({ n: 'Execute', ok: true }); }
  catch (e) { checks.push({ n: 'Execute', ok: false, e: e.message }); return { checks, valid: false, err: { type: 'Runtime', message: e.message } }; }

  if (!p.slides?.length) { checks.push({ n: 'Slide', ok: false }); return { checks, valid: false, err: { type: 'NoSlide', message: 'No slide' } }; }
  checks.push({ n: 'Slide', ok: true });

  const cnt = p.slides[p.slides.length - 1]._slideObjects?.length || 0;
  checks.push({ n: 'Content', ok: cnt > 0, d: cnt + ' obj' });
  if (!cnt) return { checks, valid: false, err: { type: 'Empty', message: 'No content' } };

  return { checks, valid: true, fns };
}

// ─── Export flow with retry ──────────────────────────────────────────────
async function runExport() {
  const expBtn = document.getElementById('expBtn');
  const genBtn = document.getElementById('genBtn');
  expBtn.disabled = true;
  genBtn.disabled = true;
  setStep(3, 'active');
  setStatus('Converting HTML → PPTX...', '');

  log('\nSTEP 2: Convert HTML → PPTX', 'h');
  log('Model: ' + MODEL_PPTX);
  log('');

  let lastCode = null, lastErr = [];

  for (let attempt = 0; attempt <= MAX_RETRIES; attempt++) {
    const feedback = attempt > 0 && lastErr.length ? { ...lastErr[0], code: lastCode } : null;

    log(`Attempt ${attempt + 1}/${MAX_RETRIES + 1}`, 'h');
    if (feedback) log(`  Retrying: ${feedback.type} — ${feedback.message}`, 'err');

    const prompt = buildPptxPrompt(currentSlideHTML, currentSlideCSS, feedback);
    log(`  Prompt: ${prompt.length} chars`, 'dim');

    try {
      const t0 = Date.now();
      const raw = await callAI(MODEL_PPTX, PPTX_SYSTEM_PROMPT, prompt);
      log(`  AI: ${((Date.now() - t0) / 1000).toFixed(1)}s, ${raw.length} chars`);

      const code = extractJSArray(raw);
      lastCode = code;
      log(`  Code: ${code.length} chars`, 'dim');

      const v = validate(code);
      for (const c of v.checks) log(`  ${c.ok ? '✓' : '✗'} ${c.n}${c.e ? ' — ' + c.e : ''}${c.d ? ' (' + c.d + ')' : ''}`, c.ok ? 'ok' : 'err');

      if (v.valid) {
        setStep(3, 'done'); setStep(4, 'active');
        log('\n✓ Generating PPTX file...', 'ok');
        const pptx = new PptxGenJS();
        pptx.defineLayout({ name: 'CUSTOM', width: 13.333, height: 7.5 }); pptx.layout = 'CUSTOM';
        try { pptx.defineSlideMaster({ title: 'BLANK_SLIDE', objects: [] }); } catch(e) {}
        v.fns[0](pptx, 1, 1);
        await pptx.writeFile({ fileName: 'test_slide.pptx' });
        log('✓ Downloaded: test_slide.pptx', 'ok');
        setStep(4, 'done');
        setStatus('Done! test_slide.pptx downloaded' + (attempt > 0 ? ` (fixed on retry ${attempt + 1})` : ''), 'ok');
        expBtn.disabled = false; genBtn.disabled = false;
        return;
      }
      lastErr = [v.err];
    } catch (err) {
      log(`  ✗ ${err.message}`, 'err');
      lastErr = [{ type: 'API', message: err.message }];
      lastCode = lastCode || '(none)';
    }
  }

  log('\n✗ ALL ATTEMPTS FAILED', 'err');
  setStatus('Export failed after all retries', 'err');
  setStep(3, 'wait');
  expBtn.disabled = false; genBtn.disabled = false;
}
  </script>
</body>
</html>
